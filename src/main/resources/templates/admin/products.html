<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品管理</title>

    <link rel="stylesheet" th:href="@{/navbar.css}">

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            margin: 100px auto 40px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .top-bar {
            text-align: right;
            margin-bottom: 20px;
        }

        .add-btn {
            background: #27ae60;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .product-img {
            width: 90px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
        }

        .status-on {
            color: #27ae60;
            font-weight: bold;
        }

        .status-off {
            color: #e74c3c;
            font-weight: bold;
        }

        .btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin: 2px;
        }

        .edit-btn {
            background: #3498db;
        }

        .on-btn {
            background: #27ae60;
        }

        .off-btn {
            background: #e67e22;
        }
    </style>
</head>

<body>
<div th:replace="~{fragments/main-navbar :: mainNavbar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h1>🎁 商品管理</h1>

    <div class="top-bar">
        <a class="add-btn" th:href="@{/admin/products/new}">
            ＋ 新增商品
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>圖片</th>
            <th>商品名稱</th>
            <th>價格</th>
            <th>庫存</th>
            <th>狀態</th>
            <th>建立時間</th>
            <th>操作</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">

            <td>
                <img th:if="${product.imageUrl != null}"
                     th:src="${product.imageUrl}"
                     class="product-img">

                <span th:if="${product.imageUrl == null}">
                    無圖片
                </span>
            </td>

            <td th:text="${product.name}">商品名稱</td>

            <td th:text="'NT$ ' + ${product.price}">NT$ 0</td>

            <td th:text="${product.stock}">0</td>

            <td>
                <span th:if="${product.status == 'ON'}"
                      class="status-on">
                    上架中
                </span>

                <span th:if="${product.status == 'OFF'}"
                      class="status-off">
                    已下架
                </span>
            </td>

            <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}">
                2026-01-01
            </td>

            <td>
                <a class="btn edit-btn"
                   th:href="@{/admin/products/edit/{id}(id=${product.id})}">
                    修改
                </a>

                <form th:if="${product.status == 'OFF'}"
                      th:action="@{/admin/products/on/{id}(id=${product.id})}"
                      method="post"
                      style="display:inline;">
                    <button class="btn on-btn" type="submit">
                        上架
                    </button>
                </form>

                <form th:if="${product.status == 'ON'}"
                      th:action="@{/admin/products/off/{id}(id=${product.id})}"
                      method="post"
                      style="display:inline;">
                    <button class="btn off-btn" type="submit">
                        下架
                    </button>
                </form>
            </td>

        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
