<nav class="main-navbar" th:fragment="mainNavbar">

    <div class="nav-menu">
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/search}">精準尋查</a>
        <a th:href="@{/business}">商業活動</a>
        <a th:href="@{/forum}">討論區</a>
        <a th:href="@{/member-center}">會員專區</a>
        <a th:href="@{/about}">關於我</a>
    </div>

    <div class="nav-user">

        <span th:if="${loggedIn}" class="welcome-text">
            👋 Hi,
            <span th:text="${loginDisplayName}">
                會員
            </span>
        </span>

        <a href="/cart" class="cart-link">

            🛒

            <span id="cartCount">
                0
            </span>

        </a>

        <a th:if="${loggedIn}"
           href="/logout"
           class="logout-link">
            🚪 登出
        </a>

    </div>

    <script th:inline="javascript">

        document.addEventListener("DOMContentLoaded", function () {

            const isLoggedIn = [[${loggedIn}]];

            async function updateCartCount() {

                const cartCount =
                    document.getElementById("cartCount");

                if (!cartCount) {
                    return;
                }

                // 未登入
                if (!isLoggedIn) {

                    cartCount.textContent = "0";

                    return;
                }

                try {

                    const response =
                        await fetch("/api/cart/detail");

                    if (!response.ok) {

                        cartCount.textContent = "0";

                        return;
                    }

                    const cartItems =
                        await response.json();

                    let totalQty = 0;

                    cartItems.forEach(function (item) {

                        totalQty +=
                            Number(item.quantity);
                    });

                    cartCount.textContent =
                        totalQty;

                } catch (error) {

                    console.error(error);

                    cartCount.textContent = "0";
                }
            }

            updateCartCount();
        });

    </script>

</nav>
