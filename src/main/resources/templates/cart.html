<!DOCTYPE html>
<html lang="zh-Hant"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>購物車</title>

  <link rel="stylesheet" th:href="@{/navbar.css}">

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei";
      background: #f4f6f8;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 100px auto 50px;
    }

    .page-title {
      font-size: 36px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }

    .cart-item {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .cart-image {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .cart-info {
      flex: 1;
    }

    .cart-name {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
    }

    .cart-price {
      color: #e67e22;
      font-size: 20px;
      margin-top: 10px;
    }

    .cart-subtotal {
      font-size: 20px;
      font-weight: bold;
      color: #27ae60;
      min-width: 120px;
      text-align: right;
    }

    .remove-btn {
      border: none;
      background: #e74c3c;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-btn:hover {
      background: #c0392b;
    }

    .summary {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
      margin-top: 20px;
      padding: 20px;
    }

    .total {
      font-size: 42px;
      font-weight: bold;
      color: #e67e22;
    }

    .checkout-btn {
      background: #28a745;
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .checkout-btn:hover {
      background: #219150;
    }

    .cart-qty-box {
      display: inline-flex;
      align-items: center;
      border: 2px solid #dcdfe6;
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    .cart-qty-box button {
      width: 38px;
      height: 38px;
      border: none;
      background: #f8f9fa;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      color: #2c3e50;
    }

    .cart-qty-box button:hover {
      background: #27ae60;
      color: white;
    }

    .cart-qty-num {
      width: 45px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .empty-cart {
      background: white;
      border-radius: 16px;
      padding: 60px 30px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .empty-cart-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .empty-cart h2 {
      color: #2c3e50;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .empty-cart p {
      color: #777;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .go-shop-btn {
      display: inline-block;
      background: #e67e22;
      color: white;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: 10px;
      font-weight: bold;
    }

    .go-shop-btn:hover {
      background: #d35400;
    }
  </style>
</head>

<body>

<div th:replace="fragments/main-navbar :: mainNavbar"></div>

<div class="container">

  <div class="page-title">
    🛒 我的購物車
  </div>

  <div id="cartContainer"></div>

  <div class="summary">

    <div class="total">
      總計：NT$
      <span id="grandTotal">0</span>
    </div>

    <a href="/checkout" class="checkout-btn">
      前往結帳
    </a>

  </div>

</div>

<script>

  const container =
          document.getElementById("cartContainer");

  const summaryBox =
          document.querySelector(".summary");

  async function loadCart() {

    try {

      const response =
              await fetch("/api/cart/detail");

      if (!response.ok) {
        throw new Error("讀取購物車失敗");
      }

      const cartItems =
              await response.json();

      container.innerHTML = "";

      let total = 0;

      if (cartItems.length === 0) {

        container.innerHTML = `
          <div class="empty-cart">

            <div class="empty-cart-icon">
              🛒
            </div>

            <h2>
              購物車是空的
            </h2>

            <p>
              目前尚未加入任何商品
            </p>

            <a href="/business#gift-store" class="go-shop-btn">
              去逛 Gift Store →
            </a>

          </div>
        `;

        summaryBox.style.display = "none";

        return;
      }

      summaryBox.style.display = "flex";

      cartItems.forEach(function (item) {

        total += Number(item.subtotal);

        container.innerHTML += `
          <div class="cart-item">

            <img
              src="${item.imageUrl || 'https://via.placeholder.com/120x90'}"
              class="cart-image">

            <div class="cart-info">

              <div class="cart-name">
                ${item.productName}
              </div>

              <div class="cart-price">
                單價：NT$ ${item.price}
              </div>

            </div>

            <div class="cart-qty-box">

              <button onclick="decreaseQty(${item.productId}, ${item.quantity})">
                −
              </button>

              <span class="cart-qty-num">
                ${item.quantity}
              </span>

              <button onclick="increaseQty(${item.productId}, ${item.quantity}, ${item.stock})">
                ＋
              </button>

            </div>

            <div class="cart-subtotal">
              NT$ ${item.subtotal}
            </div>

            <button
              class="remove-btn"
              onclick="removeItem(${item.productId})">
              刪除
            </button>

          </div>
        `;
      });

      document.getElementById("grandTotal").textContent = total;

    } catch (error) {

      container.innerHTML = `
        <div class="empty-cart">

          <div class="empty-cart-icon">
            🛒
          </div>

          <h2>
            購物車為空,購物請點取"商業活動"
          </h2>

          <p>
            購物請先加入會員
          </p>

          <a href="/register" class="go-shop-btn">
           未註冊,註冊加入會員 →
          </a>

          <br><br>

          <a href="/login" class="go-shop-btn">
            會員請先登入 →
          </a>

        </div>
      `;

      summaryBox.style.display = "none";
    }
  }

  async function increaseQty(productId, quantity, stock) {

    if (quantity >= stock) {
      alert("已超過庫存數量");
      return;
    }

    await fetch("/api/cart/update", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        productId: productId,
        quantity: quantity + 1
      })
    });

    loadCart();
  }

  async function decreaseQty(productId, quantity) {

    await fetch("/api/cart/update", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        productId: productId,
        quantity: quantity - 1
      })
    });

    loadCart();
  }

  async function removeItem(productId) {

    await fetch("/api/cart/delete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        productId: productId
      })
    });

    loadCart();
  }

  loadCart();

</script>

</body>
</html>
