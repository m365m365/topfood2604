<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <link rel="stylesheet" th:href="@{/navbar.css}">

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 100px auto 50px;
        }

        .page-title {
            font-size: 40px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }

        .checkout-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .divider {
            border-top: 1px solid #e0e0e0;
            margin: 30px 0;
        }

        .product-item,
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .product-name {
            color: #2c3e50;
        }

        .product-price {
            font-weight: bold;
        }

        .total-row {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 20px;
        }

        .empty-cart {
            color: #999;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #27ae60;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #219150;
        }
        .product-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
        }
        .product-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
        }
    </style>
</head>

<body>
<div th:replace="~{fragments/main-navbar :: mainNavbar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <div class="page-title">
        🛒 Checkout
    </div>

    <div class="checkout-card">

        <div class="section-title">
            📦 訂單資訊
        </div>

        <div class="form-group">
            <label>收件人</label>
            <input type="text" placeholder="請輸入收件人姓名">
        </div>

        <div class="form-group">
            <label>聯絡電話</label>
            <input type="text" placeholder="請輸入聯絡電話">
        </div>

        <div class="form-group">
            <label>收件地址</label>
            <input type="text" placeholder="請輸入收件地址">
        </div>

        <div class="divider"></div>

        <div class="section-title">
            🛍 商品明細
        </div>

        <div id="checkoutItems"></div>

        <div class="divider"></div>

        <div class="summary">

            <div class="summary-row">
                <span>商品總額</span>
                <span id="subtotalText">NT$0</span>
            </div>

            <div class="summary-row">
                <span>運費</span>
                <span>NT$0</span>
            </div>

            <div class="summary-row total-row">
                <span>總計</span>
                <span id="totalText">NT$0</span>
            </div>

        </div>

        <button class="checkout-btn">
            確認訂單
        </button>

    </div>

</div>

<script>

        document.addEventListener("DOMContentLoaded", function () {

        const cart =
        JSON.parse(localStorage.getItem("giftCart")) || [];

        const checkoutItems =
        document.getElementById("checkoutItems");

        const subtotalText =
        document.getElementById("subtotalText");

        const totalText =
        document.getElementById("totalText");

        let total = 0;

        checkoutItems.innerHTML = "";

        if (cart.length === 0) {

        checkoutItems.innerHTML = `
                <div class="empty-cart">
                    目前購物車沒有商品
                </div>
            `;

        subtotalText.textContent = "NT$0";
        totalText.textContent = "NT$0";

        return;
    }

        cart.forEach(function (item) {

        const itemTotal = item.price * item.qty;

        total += itemTotal;

        const imageUrl =
        item.imageUrl || item.image || "/images/no-image.png";

        checkoutItems.innerHTML += `
                <div class="product-item">

                    <div class="product-info">

                        <img class="product-img"
                             src="${imageUrl}"
                             alt="${item.name}">

                        <span class="product-name">
                            ${item.name} × ${item.qty}
                        </span>

                    </div>

                    <span class="product-price">
                        NT$${itemTotal}
                    </span>

                </div>
            `;
    });

        subtotalText.textContent = "NT$" + total;
        totalText.textContent = "NT$" + total;
    });
</script>

</body>
</html>
